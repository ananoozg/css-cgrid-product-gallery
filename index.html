<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Online Shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>My Online Shop</h1>
      <div class="products-container">
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=600&q=80" alt="Laptop" />
          <h2>Laptop</h2>
          <p>$899</p>
          <button type="button">Add to Cart</button>
        </article>
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80" alt="Smartphone" />
          <h2>Smartphone</h2>
          <p>$699</p>
          <button type="button">Add to Cart</button>
        </article>
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Headphones" />
          <h2>Headphones</h2>
          <p>$149</p>
          <button type="button">Add to Cart</button>
        </article>
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Smart Watch" />
          <h2>Smart Watch</h2>
          <p>$229</p>
          <button type="button">Add to Cart</button>
        </article>
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80" alt="Keyboard" />
          <h2>Keyboard</h2>
          <p>$89</p>
          <button type="button">Add to Cart</button>
        </article>
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=600&q=80" alt="Mouse" />
          <h2>Mouse</h2>
          <p>$49</p>
          <button type="button">Add to Cart</button>
        </article>
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=600&q=80" alt="Monitor" />
          <h2>Monitor</h2>
          <p>$329</p>
          <button type="button">Add to Cart</button>
        </article>
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80" alt="Camera" />
          <h2>Camera</h2>
          <p>$549</p>
          <button type="button">Add to Cart</button>
        </article>
      </div>
    </main>
  </body>
</html>
